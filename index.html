<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃园将星录 · 宠物图鉴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #fdf6e3 0%, #f5e6c8 100%);
    color: #5b4636;
  }
  .wrap { text-align: center; padding: 32px; }
  h1 { font-size: 28px; margin-bottom: 8px; }
  p.sub { color: #8a7460; margin-bottom: 32px; }
  .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  a.card {
    display: block; width: 240px; padding: 28px 20px;
    background: #fff; border-radius: 16px; text-decoration: none; color: #5b4636;
    box-shadow: 0 6px 20px rgba(160, 120, 60, .15);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.card:hover { transform: translateY(-4px); box-shadow: 0 10px 26px rgba(160, 120, 60, .25); }
  .card .title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .card .desc { font-size: 14px; color: #8a7460; line-height: 1.7; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>桃园将星录 · 宠物图鉴</h1>
    <p class="sub">请选择要打开的版本</p>
    <div class="cards">
      <a class="card" href="website/">
        <div class="title">正式版</div>
        <div class="desc">图鉴本体 + 全部工具功能，功能完整可用</div>
      </a>
      <a class="card" href="lock/">
        <div class="title">锁版</div>
        <div class="desc">工具功能已锁定，图鉴本体完好可用</div>
      </a>
    </div>
  </div>
</body>
</html>
